<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipForge — YouTube Short Analyzer</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f5f5f5;background:#09090b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#241442,#09090b 45%);min-height:100vh}
main{max-width:1050px;margin:auto;padding:55px 22px 80px}.badge{display:inline-block;padding:7px 11px;border:1px solid #3f3f46;border-radius:999px;color:#c4b5fd;font-size:12px}
h1{font-size:clamp(40px,7vw,76px);line-height:.95;margin:18px 0}.sub{color:#a1a1aa;max-width:700px;font-size:18px;line-height:1.6}
.form{display:flex;gap:10px;margin:30px 0}.form input{flex:1;background:#111113;border:1px solid #3f3f46;border-radius:14px;padding:16px;color:white;font-size:16px}.form button{border:0;border-radius:14px;padding:0 24px;background:#8b5cf6;color:white;font-weight:700;cursor:pointer}.form button:disabled{opacity:.6}
#status{color:#a1a1aa;margin:14px 0}.card{background:#111113;border:1px solid #27272a;border-radius:20px;padding:22px;margin:18px 0}.meta{display:flex;gap:16px;flex-wrap:wrap;color:#a1a1aa;font-size:14px}.rank{color:#c4b5fd;font-weight:800}.time{font-variant-numeric:tabular-nums;color:#fff}.headline{font-size:21px;font-weight:800;margin:12px 0}.hook{font-size:18px;line-height:1.5}.why{color:#d4d4d8;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:#18181b;border-radius:14px;padding:15px}.box b{display:block;margin-bottom:7px}.box p,.box li{color:#c4c4ca;line-height:1.55}ul{padding-left:20px}
@media(max-width:700px){.form,.grid{display:block}.form input{width:100%;margin-bottom:10px}.form button{width:100%;height:52px}}
</style></head>
<body><main>
<span class="badge">CLIPFORGE · SHORT-FORM INTELLIGENCE</span>
<h1>Turn one YouTube video into your strongest Shorts.</h1>
<p class="sub">Paste a YouTube URL. ClipForge finds the strongest standalone moments, preserves exact timestamps, and gives you an editor-ready plan.</p>
<div class="form"><input id="url" placeholder="https://www.youtube.com/watch?v=..."><button id="go">Analyze video</button></div>
<div id="status"></div><section id="results"></section>
</main>
<script>
const $=id=>document.getElementById(id);
function fmt(sec){sec=Math.round(sec);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("go").onclick=async function(){
 const url=$("url").value.trim();
 if(!url){$("status").textContent="Paste a YouTube URL first.";return}
 $("go").disabled=true;$("status").textContent="Fetching captions and analyzing the strongest moments…";$("results").innerHTML="";
 try{
  const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:url})});
  const d=await r.json();if(!r.ok)throw new Error(d.detail||"Analysis failed");
  $("status").textContent=d.number_of_shorts+" clips selected.";
  let html="<h2>"+esc(d.video_title)+"</h2>";
  d.shorts.forEach(function(s,i){
   html+='<article class="card"><div class="meta"><span class="rank">#'+(i+1)+'</span><span class="time">'+fmt(s.start)+"–"+fmt(s.end)+" · "+Math.round(s.duration)+'s</span></div>'+
   "<h2>"+esc(s.title)+"</h2><div class=\"headline\">"+esc(s.headline)+"</div>"+
   '<p class="hook"><b>Hook:</b> “'+esc(s.hook)+"”</p><p class=\"why\">"+esc(s.why)+"</p>"+
   '<div class="grid"><div class="box"><b>Editing instructions</b><ul>'+s.editing.map(x=>"<li>"+esc(x)+"</li>").join("")+
   '</ul></div><div class="box"><b>Trim + retention</b><p>'+esc(s.trim)+"</p><p>"+esc(s.retention)+"</p></div></div></article>";
  });
  $("results").innerHTML=html;
 }catch(e){$("status").textContent=e.message}
 finally{$("go").disabled=false}
};
</script></body></html>
